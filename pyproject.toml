[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "folder-organizer"
version = "0.1.0"
description = "AI-powered local file organizer CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.2",
    "rich==15.0.0",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "python-magic==0.4.27",
    "openai==3.8.0",
    "PyYAML==6.0.3",
]

[project.scripts]
folder-organizer = "folder_organizer.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.167.1",
    "responses==0.26.3",
    "pytest-mock==3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
